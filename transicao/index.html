<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animação de Cartas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">
        <h1>Animação de Cartas</h1>

        <p class="descricao">
            Clique nos botões para virar ou desvirar as cartas.
        </p>

        <section class="cartas">

            <!-- Carta 1 -->
            <div class="carta" id="carta1">
                <div class="carta-conteudo">

                    <div class="frente">
                        <div class="simbolo">★</div>
                        <h2>Carta 1</h2>
                        <p>Frente</p>
                    </div>

                    <div class="verso">
                        <div class="simbolo">♛</div>
                        <h2>Carta 1</h2>
                        <p>Verso</p>
                    </div>

                </div>
            </div>

            <!-- Carta 2 -->
            <div class="carta" id="carta2">
                <div class="carta-conteudo">

                    <div class="frente">
                        <div class="simbolo">♥</div>
                        <h2>Carta 2</h2>
                        <p>Frente</p>
                    </div>

                    <div class="verso">
                        <div class="simbolo">♦</div>
                        <h2>Carta 2</h2>
                        <p>Verso</p>
                    </div>

                </div>
            </div>

            <!-- Carta 3 -->
            <div class="carta" id="carta3">
                <div class="carta-conteudo">

                    <div class="frente">
                        <div class="simbolo">♠</div>
                        <h2>Carta 3</h2>
                        <p>Frente</p>
                    </div>

                    <div class="verso">
                        <div class="simbolo">♣</div>
                        <h2>Carta 3</h2>
                        <p>Verso</p>
                    </div>

                </div>
            </div>

        </section>

        <section class="botoes">
            <button id="virar">Virar</button>
            <button id="desvirar">Desvirar</button>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
